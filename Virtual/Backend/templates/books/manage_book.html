{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Manage Books</title>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/navbar.css' %}">
    <link rel="stylesheet" href="{% static 'books/manage_book.css' %}">
</head>

<body>

<nav></nav>

<hr>

<h1>Manage Books</h1>

<div id="tableContainer">

    <table border="1" style="width:100%; text-align:center;">
        <thead>
            <tr>
                <th>ID</th>
                <th>Book Name</th>
                <th>Author</th>
                <th>Category</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>

            {% for book in books %}
            <tr>

                <td>{{ book.id }}</td>

                <!-- ONE FORM PER ROW -->
                <form method="POST">
                    {% csrf_token %}

                    <input type="hidden" name="book_id" value="{{ book.id }}">

                    <td>
                        <input type="text" name="name" value="{{ book.name }}">
                    </td>

                    <td>
                        <input type="text" name="author" value="{{ book.author }}">
                    </td>

                    <td>
                        <input type="text" name="category" value="{{ book.category }}">
                    </td>

                    <td>

                        <!-- EDIT / SAVE -->
                        <button type="submit" name="action" value="edit" class="edit-btn">
                            Save
                        </button>

                        <!-- DELETE -->
                        <button type="submit" name="action" value="delete" class="delete-btn">
                            Delete
                        </button>

                    </td>

                </form>

            </tr>

            {% empty %}
            <tr>
                <td colspan="5">No books found</td>
            </tr>
            {% endfor %}

        </tbody>
    </table>

</div>

</body>
</html>
